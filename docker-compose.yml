services:
  db:
    image: kartoza/postgis:15-3.4
    container_name: postgres_container
    hostname: ${POSTGRES_HOST}
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - ${POSTGRES_PORT}:5432
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db_init_scripts:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 120s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:8.11.0
    container_name: pgadmin_container
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGADMIN_PORT=${PGADMIN_PORT}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin-init.sh:/entrypoint_custom.sh
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    user: root
    entrypoint: /entrypoint_custom.sh
    ports:
      - $PGADMIN_PORT:80
    networks:
      - app_network

  api_server:
    env_file:
      - .env
    build:
      context: api_server
      dockerfile: Dockerfile
    image: api_server_image
    container_name: api_server_container
    environment:
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    ports:
      - ${API_SERVER_PORT}:4000
    volumes:
      - ./api_server:/app
    depends_on:
      - db
      - rustfs
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_SERVER_PORT}/health", "-H", "accept: application/json", "-H", "Authorization: Bearer ${API_SERVER_KEY}" ]
      interval: 120s
      timeout: 5s
      retries: 3

  nextjs_app:
    environment:
      - NEXT_PUBLIC_PORT=${NEXT_PUBLIC_PORT}
      - API_SERVER_KEY=${API_SERVER_KEY}
      - WATCHPACK_POLLING_INTERVAL=500
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_API_SERVER_KEY=${API_SERVER_KEY}
      - NEXT_PUBLIC_LLM_SERVICE_URL=${NEXT_PUBLIC_LLM_SERVICE_URL:-http://localhost:8000}
    build:
      context: nextjs_app
      dockerfile: Dockerfile
      args:
        PORT: ${NEXT_PUBLIC_PORT}
    image: nextjs_app_image
    container_name: nextjs
    ports:
      - ${NEXT_PUBLIC_PORT}:${NEXT_PUBLIC_PORT}
    volumes:
      - ./nextjs_app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
      - api_server
    networks:
      - app_network

  rustfs:
    image: rustfs/rustfs
    container_name: rustfs_container
    ports:
      - "${RUSTFS_PORT1}:${RUSTFS_PORT1}"
      - "${RUSTFS_PORT2}:${RUSTFS_PORT2}"
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_VOLUMES=/data
    networks:
      - app_network

  llm_service:
    build:
      context: llm_service
      dockerfile: Dockerfile
    image: llm_service_image
    container_name: llm_service_container
    environment:
      - API_SERVER_URL=http://api_server:4000
      - PRIMARY_LLM_BASE_URL=${PRIMARY_LLM_BASE_URL}
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL}
      - PRIMARY_LLM_API_KEY=${PRIMARY_LLM_API_KEY}
      - VERIFIER_LLM_BASE_URL=${VERIFIER_LLM_BASE_URL}
      - VERIFIER_LLM_MODEL=${VERIFIER_LLM_MODEL}
      - VERIFIER_LLM_API_KEY=${VERIFIER_LLM_API_KEY}
      - MAX_FEATURES_IN_CONTEXT=${MAX_FEATURES_IN_CONTEXT:-200}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - CORS_ORIGINS=${LLM_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${LLM_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./llm_service/app:/app/app
    depends_on:
      - api_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network


networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data:
  rustfs_data:
  