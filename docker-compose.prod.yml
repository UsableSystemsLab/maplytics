services:
  db:
    image: kartoza/postgis:15-3.4
    container_name: postgres_container
    hostname: ${POSTGRES_HOST}
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db_init_scripts:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 120s
      timeout: 5s
      retries: 3

  api_server:
    env_file:
      - .env.prod
    build:
      context: api_server
      dockerfile: Dockerfile
    image: api_server_image
    container_name: api_server_container
    environment:
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    ports:
      - ${API_SERVER_PORT}:4000
    depends_on:
      - db
      - rustfs
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_SERVER_PORT}/health", "-H", "accept: application/json", "-H", "Authorization: Bearer ${API_SERVER_KEY}" ]
      interval: 120s
      timeout: 5s
      retries: 3

  nextjs_app:
    env_file:
      - .env.prod
    build:
      context: nextjs_app
      dockerfile: Dockerfile
      args:
        PORT: ${NEXT_PUBLIC_PORT}
    image: nextjs_app_image
    container_name: nextjs
    environment:
      - NEXT_PUBLIC_PORT=${NEXT_PUBLIC_PORT}
      - API_SERVER_KEY=${API_SERVER_KEY}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_API_SERVER_KEY=${API_SERVER_KEY}
    ports:
      - ${NEXT_PUBLIC_PORT}:${NEXT_PUBLIC_PORT}
    depends_on:
      - db
      - api_server
    networks:
      - app_network
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs
    container_name: rustfs_container
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_VOLUMES=/data
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
  rustfs_data:
