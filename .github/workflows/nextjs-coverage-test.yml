name: Next.js Coverage CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # ENV SETUP
      # -------------------------
      - name: Create env file
        run: cp example.env .env

      # -------------------------
      # NODE SETUP (IMPORTANT BEST PRACTICE)
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_app/package-lock.json

      # -------------------------
      # INSTALL
      # -------------------------
      - name: Install dependencies
        working-directory: nextjs_app
        run: npm install

      # -------------------------
      # TESTS (WITH COVERAGE)
      # -------------------------
      - name: Run tests
        working-directory: nextjs_app
        run: npm run test -- --coverage

      # -------------------------
      # BUILD CHECK
      # -------------------------
      - name: Build app
        working-directory: nextjs_app
        run: npm run build