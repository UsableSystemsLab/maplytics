version: "3.9"

services:
  nlq-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: nlq-geospatial-pipeline:latest
    container_name: nlq-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount config so you can tweak settings without rebuilding
      - ./config:/app/config:ro
      # Persist HuggingFace model cache across restarts
      - hf-model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G       # transformer model needs ~1.5G on CPU
          cpus: "2.0"

volumes:
  hf-model-cache:
